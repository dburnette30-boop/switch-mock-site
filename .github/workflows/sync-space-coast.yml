name: Sync Space Coast Live dates
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync_space_coast.py
      - .github/workflows/sync-space-coast.yml
permissions:
  contents: write
  pages: write
concurrency:
  group: space-coast-schedule-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import public SWITCH schedule
        run: python scripts/sync_space_coast.py
      - name: Save updated dates and rebuild the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- space-coast-dates.json; then
            echo 'Schedule is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add space-coast-dates.json
          git commit -m 'Sync SWITCH dates from Space Coast Live'
          git push origin HEAD:main
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
